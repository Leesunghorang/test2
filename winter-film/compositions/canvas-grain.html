  <div data-hf-id="hf-00lg" id="root" data-composition-id="grain" data-width="1920" data-height="1080" data-no-timeline data-layout-ignore>

  <script>
    (function () {
      const ctx = document.getElementById('grain-canvas').getContext('2d');

      for (let y = 0; y < 1080; y += 3) {

        ctx.fillStyle = `rgba(90,80,110,${0.08 + rnd() * 0.12})`;
        ctx.fillRect(x, 0, 1, 1080);
      }
      for (let i = 0; i < 9000; i++) {
        ctx.fillStyle = `rgba(70,60,90,${rnd() * 0.25})`;
        ctx.fillRect(rnd() * 1920, rnd() * 1080, 1 + rnd() * 2, 1);
      }
    })();
