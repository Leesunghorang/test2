<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    #snow-canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  </style>
  <div data-hf-id="hf-uqex" id="root" data-composition-id="snow" data-width="1920" data-height="1080" data-layout-ignore>
    <canvas data-hf-id="hf-csde" id="snow-canvas" width="1920" height="1080"></canvas>
  </div>
  <script>
    (function () {
      const W = 1920, H = 1080, MAX = 1500, DUR = 30;
      function rngFrom(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = rngFrom(1225);
      const flakes = [];
      for (let i = 0; i < MAX; i++) {
        const d = 0.25 + rnd() * 0.75;
        flakes.push({ x0: rnd() * (W + 600), y0: rnd() * (H + 60), d, v: 55 + 190 * d, ph: rnd() * 6.28, r: 1.1 + 3.6 * d * (0.7 + rnd() * 0.6), rot: rnd() * 3.14 });
      }
      const dabs = [];
      for (let i = 0; i < 260; i++) dabs.push({ x: rnd() * W, k: rnd(), len: 60 + rnd() * 160, w: 3 + rnd() * 7, shade: rnd() });

      const smooth = (k) => { k = Math.min(1, Math.max(0, k)); return k * k * (3 - 2 * k); };
      const count = (t) => 220 + (MAX - 220) * smooth(t / 25);
      // wind: integrated offset (px) so every frame stands on its own
      const windOff = (t) => 40 * t + 26 * t * smooth((t - 14) / 8) * 1.0 + 70 * Math.sin(0.42 * t) + 50 * Math.sin(0.9 * t + 1);
      const windSpeed = (t) => 40 + 26 * smooth((t - 14) / 8) + 29 * Math.cos(0.42 * t) + 45 * Math.cos(0.9 * t + 1);
      const groundH = (t) => 20 + 180 * Math.pow(Math.min(1, t / DUR), 1.2);
      const edge = (x, h) => H - h - (h / 170) * (14 * Math.sin(x / 150 + 0.7) + 8 * Math.sin(x / 61 + 2) + 18 * Math.exp(-(((x - 120) / 260) ** 2)) + 26 * Math.exp(-(((x - 1830) / 220) ** 2)));

      function draw(t) {
        const ctx = document.getElementById('snow-canvas').getContext('2d');
        ctx.clearRect(0, 0, W, H);
        const n = count(t), off = windOff(t), ws = windSpeed(t), h = groundH(t);
        // falling flakes
        for (let i = 0; i < MAX; i++) {
          const f = flakes[i];
          const fade = Math.min(1, Math.max(0, (n - i) / 60));
          if (fade <= 0) continue;
          let y = ((f.y0 + f.v * t) % (H + 60)) - 30;
          let x = (((f.x0 + off * (0.5 + f.d) + 18 * Math.sin(1.3 * t + f.ph)) % (W + 600)) + (W + 600)) % (W + 600) - 300;
          if (x < -20 || x > W + 20) continue;
          if (y > edge(x, h) + 4) continue;
          const a = (0.45 + 0.5 * f.d) * fade;
          const streak = Math.min(18, Math.max(0, (ws - 60) * 0.12)) * f.d;
          ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(f.v, ws * (0.5 + f.d)) - 1.5708 + f.rot * 0.15);
          ctx.fillStyle = `rgba(150,140,180,${a * 0.35})`;
          ctx.beginPath(); ctx.ellipse(0.8, 1.2, f.r * 1.05, f.r + streak * 0.5, 0, 0, 6.283); ctx.fill();
          ctx.fillStyle = `rgba(250,249,253,${a})`;
          ctx.beginPath(); ctx.ellipse(0, 0, f.r, f.r * 0.85 + streak * 0.5, 0, 0, 6.283); ctx.fill();
          ctx.restore();
        }
        // accumulated snow ground
        ctx.beginPath(); ctx.moveTo(0, H);
        for (let x = 0; x <= W; x += 12) ctx.lineTo(x, edge(x, h));
        ctx.lineTo(W, H); ctx.closePath();
        ctx.save(); ctx.shadowColor = 'rgba(90,75,140,0.45)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = -3;
        ctx.fillStyle = '#fbfbfe'; ctx.fill(); ctx.restore();
        // painterly shadow and highlight dabs inside the drift
        for (const d of dabs) {
          const top = edge(d.x, h);
          const y = top + 6 + d.k * (H - top);
          if (y > H + 4) continue;
          ctx.strokeStyle = d.shade < 0.55 ? 'rgba(200,195,218,0.55)' : d.shade < 0.85 ? 'rgba(222,219,233,0.7)' : 'rgba(255,255,255,0.9)';
          ctx.lineWidth = d.w; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(d.x - d.len / 2, y); ctx.quadraticCurveTo(d.x, y - 4, d.x + d.len / 2, y + 2); ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 3;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 12) { const yy = edge(x, h) + 2; x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }
        ctx.stroke();
        ctx.strokeStyle = 'rgba(150,140,190,0.55)'; ctx.lineWidth = 3;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 12) { const yy = edge(x, h) + 9; x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }
        ctx.stroke();
      }

      const st = { t: 0 };
      draw(0);
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => draw(st.t) }, 0);
      window.__timelines['snow'] = tl;
    })();
  </script>
</template>
